name: PR Lifecycle Events

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  pr-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print PR event type
        run: echo "Event type: ${{ github.event.action }}"

      - name: Print PR title
        run: echo "PR title: ${{ github.event.pull_request.title }}"

      - name: Print PR author
        run: echo "Author: ${{ github.event.pull_request.user.login }}"

      - name: Print source and target branches
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Run only when PR is merged
        if: github.event.pull_request.merged == true
        run: echo "PR was merged!"
