name: Docker Build and Publish

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set short commit SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/github-actions-app:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/github-actions-app:sha-${SHORT_SHA} .


      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-app:sha-${SHORT_SHA}
